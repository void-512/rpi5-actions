name: Vulkan SDK - Debian 13

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'LunarG SDK version, or blank for the latest Linux release'
        type: string
        required: false
      prefix:
        description: 'Absolute installation prefix for extraction from /, or blank for the versioned SDK directory'
        type: string
        required: false
      full_sdk:
        description: 'Build all SDK components, including GUI tools'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      REQUESTED_SDK_VERSION: ${{ inputs.sdk_version }}
      REQUESTED_PREFIX: ${{ inputs.prefix }}
      FULL_SDK: ${{ inputs.full_sdk }}
      CMAKE_BUILD_PARALLEL_LEVEL: '6'
      CFLAGS: '-O3 -mcpu=cortex-a76+nossbs+noras -flto -ffunction-sections -fdata-sections'
      CXXFLAGS: '-O3 -mcpu=cortex-a76+nossbs+noras -flto -stdlib=libc++ -ffunction-sections -fdata-sections'
      LDFLAGS: '-Wl,-O3 -Wl,--strip-all -Wl,--gc-sections -fuse-ld=lld -flto -rtlib=compiler-rt -unwindlib=libunwind'
      OUTPUT_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Check out build recipe
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build release archive
        id: build
        uses: ./.github/actions/debian-build
        with:
          script: .github/scripts/build-vulkansdk.sh
          env-vars: REQUESTED_SDK_VERSION REQUESTED_PREFIX FULL_SDK CMAKE_BUILD_PARALLEL_LEVEL CFLAGS CXXFLAGS LDFLAGS

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30
