name: OpenSSL - Debian 13

on:
  workflow_dispatch:
    inputs:
      openssl_tag:
        description: 'OpenSSL Git tag, or blank for the latest stable release'
        type: string
        required: false
      prefix:
        description: 'Absolute installation prefix, or blank for the Debian system prefix'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      REQUESTED_OPENSSL_TAG: ${{ inputs.openssl_tag }}
      REQUESTED_PREFIX: ${{ inputs.prefix }}
      CFLAGS: '-O3 -ffast-math -mcpu=cortex-a76+nossbs+noras -flto -fPIC -ffunction-sections -fdata-sections'
      LDFLAGS: '-fuse-ld=lld -Wl,-O3 -Wl,--strip-all -Wl,--gc-sections'
      OUTPUT_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Check out build recipe
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build release archive
        id: build
        uses: ./.github/actions/debian-build
        with:
          script: .github/scripts/build-openssl.sh
          env-vars: REQUESTED_OPENSSL_TAG REQUESTED_PREFIX CFLAGS LDFLAGS

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30
