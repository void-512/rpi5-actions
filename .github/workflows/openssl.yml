name: OpenSSL - Debian

on:
  workflow_dispatch:
    inputs:
      openssl_tag:
        description: 'OpenSSL Git tag; leave blank for the latest stable release'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: openssl-debian-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CFLAGS: '-O3 -ffast-math -mcpu=cortex-a76+nossbs+noras -flto -fPIC -ffunction-sections -fdata-sections'
      LDFLAGS: '-fuse-ld=lld -Wl,-O3 -Wl,--strip-all -Wl,--gc-sections'
      REQUESTED_OPENSSL_TAG: ${{ inputs.openssl_tag }}
      OUTPUT_DIR: ${{ github.workspace }}/dist

    steps:
      # A job-level container would use the system Docker daemon. Instead,
      # share one bounded tmpfs between scratch space and an isolated daemon.
      - name: Start isolated Debian 13 container in RAM
        run: |
          set -euo pipefail
          docker --version
          dockerd --version
          task_id="openssl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ram_root="$HOME/.cache/codex-tmp/$task_id"
          docker_root="$HOME/.cache/codex-docker/$task_id"
          mkdir -p "$ram_root" "$docker_root"
          printf 'RAM_ROOT=%s\nDOCKER_ROOT=%s\n' "$ram_root" "$docker_root" >> "$GITHUB_ENV"
          sudo mount -t tmpfs -o size=4G,mode=0700 tmpfs "$ram_root"
          sudo chown "$(id -u):$(id -g)" "$ram_root"
          mkdir -p "$ram_root/docker" "$ram_root/work" "$ram_root/tmp"
          sudo mount --bind "$ram_root/docker" "$docker_root"
          test "$(findmnt -n -o FSTYPE -T "$ram_root")" = tmpfs
          test "$(findmnt -n -o FSTYPE -T "$docker_root")" = tmpfs
          export TMPDIR="$ram_root/tmp" TMP="$ram_root/tmp" TEMP="$ram_root/tmp"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$TMPDIR" "$TMP" "$TEMP" >> "$GITHUB_ENV"
          mkdir -p "$docker_root/data" "$docker_root/exec"
          # Docker's managed containerd uses these same private data/exec roots.
          printf '%s\n' '{"features":{"containerd-snapshotter":false},"log-driver":"none"}' \
            > "$docker_root/daemon.json"
          # shellcheck disable=SC2024
          sudo env TMPDIR="$TMPDIR" TMP="$TMP" TEMP="$TEMP" \
            dockerd --config-file "$docker_root/daemon.json" \
            --data-root "$docker_root/data" --exec-root "$docker_root/exec" \
            --pidfile "$docker_root/dockerd.pid" --host "unix://$docker_root/docker.sock" \
            --group "$(id -gn)" --storage-driver overlay2 \
            --bridge none --iptables=false --ip6tables=false \
            --ip-forward=false --ip-masq=false --userland-proxy=false \
            > "$docker_root/dockerd.log" 2>&1 &
          export DOCKER_HOST="unix://$docker_root/docker.sock"
          printf 'DOCKER_HOST=%s\n' "$DOCKER_HOST" >> "$GITHUB_ENV"
          for ((attempt=0; attempt<60; attempt++)); do
            if docker info > "$docker_root/docker-info.log" 2>&1; then break; fi
            sleep 1
          done
          if ! actual_root="$(docker info --format '{{.DockerRootDir}}')"; then
            cat "$docker_root/dockerd.log"
            exit 1
          fi
          test "$actual_root" = "$docker_root/data"
          # All bind mounts are on the shared tmpfs. Copy only final artifacts out.
          docker run --detach --name openssl-build --network host --log-driver none \
            --env DEBIAN_FRONTEND=noninteractive --env LANG=C.UTF-8 --env LC_ALL=C.UTF-8 \
            --env CFLAGS --env LDFLAGS --env REQUESTED_OPENSSL_TAG \
            --env TMPDIR="$ram_root/work" --env TMP="$ram_root/work" \
            --env TEMP="$ram_root/work" --env BUILD_ROOT="$ram_root/work" \
            --volume "$ram_root/work:$ram_root/work" \
            debian:13-slim sleep infinity

      - name: Build OpenSSL with LLVM 23, PIC and LTO
        run: |
          set -euo pipefail
          docker exec -i openssl-build bash -seuo pipefail <<'BUILD'
          test "$(stat -f -c %T "$BUILD_ROOT")" = tmpfs
          test "$(dpkg --print-architecture)" = arm64
          # shellcheck source=/dev/null
          . /etc/os-release
          test "$VERSION_ID" = 13
          work="$(mktemp -d)"
          export TMPDIR="$work" TMP="$work" TEMP="$work"
          cd "$work"

          # Completed scratch is removed immediately. All remaining files are
          # active, so stop above 80% RAM storage usage without a disk fallback.
          build_pid=$$
          monitor_ram() {
            while sleep 5; do
              used="$(df --output=pcent "$BUILD_ROOT" | tail -n1 | tr -dc '0-9')"
              if (( used > 80 )); then
                printf '%s\n' '::error::4 GiB RAM storage exceeds 80%; no completed scratch to reclaim or disk fallback.' >&2
                kill -TERM "$build_pid"
                return
              fi
            done
          }
          monitor_ram &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT

          apt_options=(-o APT::Keep-Downloaded-Packages=false
            -o Binary::apt::APT::Keep-Downloaded-Packages=false)
          apt-get "${apt_options[@]}" update
          apt-get "${apt_options[@]}" upgrade -y
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            ca-certificates curl gnupg git make perl libc6-dev openssl
          # Discover APT configuration and tool locations rather than assuming
          # installation paths. Always install the newest LLVM 23 packages.
          apt_sources='' apt_lists=''
          eval "$(apt-config shell apt_sources Dir::Etc::sourceparts/d apt_lists Dir::State::lists/d)"
          apt_keyrings="$(dirname "$apt_sources")/keyrings"
          mkdir -p "$apt_keyrings"
          curl --fail --silent --show-error --location --retry 5 \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o "$apt_keyrings/llvm.gpg"
          printf 'deb [signed-by=%s] https://apt.llvm.org/trixie/ llvm-toolchain-trixie-23 main\n' \
            "$apt_keyrings/llvm.gpg" > "$apt_sources/llvm23.list"
          apt-get "${apt_options[@]}" update
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            clang-23 lld-23 llvm-23 libclang-rt-23-dev
          apt-get clean
          rm -rf "${apt_lists:?}/"*
          llvm_bin="$(dirname "$(readlink -f "$(command -v clang-23)")")"
          export PATH="$llvm_bin:$PATH"
          export CC=clang CXX=clang++ LD=ld.lld AR=llvm-ar RANLIB=llvm-ranlib
          export NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy READELF=llvm-readelf
          export AS="$CC"
          "$CC" --version
          "$LD" --version
          test "$("$CC" -dumpversion | cut -d. -f1)" = 23

          tag="${REQUESTED_OPENSSL_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="$(git ls-remote --tags --refs https://github.com/openssl/openssl.git \
              | sed -n 's|.*refs/tags/\(openssl-[0-9]\+\.[0-9]\+\.[0-9]\+\)$|\1|p' \
              | sort -V | tail -n1)"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            printf '::error::Invalid OpenSSL tag: %s\n' "$tag" >&2
            exit 1
          fi
          # Fetch the exact tag: a branch with the same name cannot be selected.
          git init source
          git -C source remote add origin https://github.com/openssl/openssl.git
          git -C source fetch --depth 1 origin "refs/tags/$tag"
          git -C source checkout --detach FETCH_HEAD
          rm -rf source/.git
          mkdir build stage "$BUILD_ROOT/artifacts"
          cd build
          prefix="$(dirname "$(dirname "$(command -v make)")")"
          openssl_dir="$(openssl version -d | cut -d '"' -f2)"
          perl ../source/Configure linux-aarch64 shared enable-pic no-tests no-docs \
            --prefix="$prefix" --libdir=lib --openssldir="$openssl_dir"
          make -j"$(nproc)"
          make DESTDIR="$work/stage" install_sw

          # Verify the installed command and PIC static archives without building
          # OpenSSL's disabled test suite. -z text rejects non-PIC relocations.
          installed="$work/stage$prefix"
          export LD_LIBRARY_PATH="$installed/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$installed/bin/openssl" version -a
          digest="$(printf abc | "$installed/bin/openssl" dgst -sha256 -r)"
          test "${digest%% *}" = ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          printf '%s\n' '#include <openssl/ssl.h>' \
            'SSL_CTX *probe(void) { return SSL_CTX_new(TLS_method()); }' > "$work/pic.c"
          # Intentional shell splitting for the compiler/linker flag lists.
          # shellcheck disable=SC2086
          "$CC" $CFLAGS -I"$installed/include" -shared "$work/pic.c" \
            "$installed/lib/libssl.a" "$installed/lib/libcrypto.a" \
            $LDFLAGS -Wl,-z,text -pthread -ldl -o "$work/pic.so"
          "$READELF" --file-header "$installed/bin/openssl" | grep 'Machine:.*AArch64'
          "$READELF" --dynamic "$work/pic.so" > "$work/pic-dynamic.txt"
          if grep TEXTREL "$work/pic-dynamic.txt"; then exit 1; fi

          tar -czf "$BUILD_ROOT/artifacts/${tag}-debian13.tar.gz" -C "$installed" .
          cd "$BUILD_ROOT"
          rm -rf -- "$work"
          BUILD

      - name: Collect release archive
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          docker cp "openssl-build:$RAM_ROOT/work/artifacts/." "$OUTPUT_DIR/"

      - name: Upload OpenSSL
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ env.OUTPUT_DIR }}/*.tar.gz
          archive: false
          if-no-files-found: error

      - name: Stop isolated Docker and release RAM
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "${RAM_ROOT:-}" ]]; then exit 0; fi
          if mountpoint -q "$DOCKER_ROOT"; then
            export DOCKER_HOST="unix://$DOCKER_ROOT/docker.sock"
            docker rm --force openssl-build > "$RAM_ROOT/cleanup.log" 2>&1 || true
            if sudo test -f "$DOCKER_ROOT/dockerd.pid"; then
              daemon_pid="$(sudo cat "$DOCKER_ROOT/dockerd.pid")"
              sudo kill -TERM "$daemon_pid"
              for ((attempt=0; attempt<30; attempt++)); do
                if ! sudo kill -0 "$daemon_pid" 2> "$RAM_ROOT/daemon-status.log"; then break; fi
                sleep 1
              done
            fi
            sudo umount --recursive "$DOCKER_ROOT"
          fi
          if mountpoint -q "$RAM_ROOT"; then sudo umount --recursive "$RAM_ROOT"; fi
          rmdir "$DOCKER_ROOT" "$RAM_ROOT"
