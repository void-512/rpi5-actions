name: qBittorrent-nox - Debian 13

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      CFLAGS: '-O3 -mcpu=cortex-a76+nossbs+noras -flto -ffunction-sections -fdata-sections'
      CXXFLAGS: '-O3 -mcpu=cortex-a76+nossbs+noras -flto -ffunction-sections -fdata-sections -std=c++26'
      LDFLAGS: '-fuse-ld=lld -flto -Wl,-O3 -Wl,--strip-all -Wl,--gc-sections'
      OUTPUT_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Check out build recipe
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build release archive
        id: build
        uses: ./.github/actions/debian-build
        with:
          script: .github/scripts/build-qbittorrent-nox.sh
          env-vars: CFLAGS CXXFLAGS LDFLAGS

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30
