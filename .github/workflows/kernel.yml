name: Raspberry Pi 5 Optimized Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch in raspberrypi/linux, for example rpi-6.18.y'
        type: string
        required: true
        default: rpi-6.18.y

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      OUTPUT_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Check out build recipe
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check out Raspberry Pi Linux
        uses: actions/checkout@v7.0.1
        with:
          repository: raspberrypi/linux
          ref: refs/heads/${{ env.KERNEL_BRANCH }}
          path: linux
          persist-credentials: false

      - name: Install LLVM 23 and build dependencies
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/apt-llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            bc bison clang-23 flex gzip kmod libelf-dev libssl-dev lld-23 llvm-23 make xz-utils
          echo '/usr/lib/llvm-23/bin' >> "$GITHUB_PATH"

      - name: Build release archive
        id: build
        run: |
          scratch="$HOME/.cache/codex-tmp/kernel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$scratch"
          sudo mount -t tmpfs -o "size=4G,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$scratch"
          trap 'sudo umount "$scratch" && rmdir "$scratch"' EXIT
          test "$(findmnt -n -o FSTYPE -T "$scratch")" = tmpfs
          mkdir "$scratch/tmp"
          export TMPDIR="$scratch/tmp" TMP="$scratch/tmp" TEMP="$scratch/tmp"
          if ! bash .github/kernel/build.sh "$GITHUB_WORKSPACE/linux" "$scratch/build" "$OUTPUT_DIR"; then
            df -h "$scratch" >&2
            exit 1
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30
